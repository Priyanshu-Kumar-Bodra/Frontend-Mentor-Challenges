<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | QR code component</title>

  <style>
    body {
      background-color: hsl(212, 45%, 89%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      width: 250px;
      background-color: white;
      border-radius: 22px;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.15);
    }

    .qr-image {
      width: 100%;
      border-radius: 10px;
    }

    .text1 {
      font-family: 'Outfit';
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin: 15px 10px;
      color: hsl(218, 44%, 22%);
    }

    .text2 {
      font-family: 'Outfit';
      font-size: 13px;
      font-weight: 400;
      text-align: center;
      margin: 0 15px 20px 15px;
      color: hsl(216, 15%, 48%);
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="./images/image-qr-code.png" class="qr-image">
    <div class="text1">Improve your front-end skills by building projects</div>
    <div class="text2">Scan the QR code to visit Frontend Mentor
      and take your coding skills to the next level
    </div>
  </div>
  
</body>
</html>
